## 4. Database Migrations

### 4.1 Migration Strategy

**Tool:** [golang-migrate](https://github.com/golang-migrate/migrate)
**Approach:** Migrations run **automatically** on deployment. Zero-downtime.

\`\`\`bash
# Create new migration
migrate create -ext sql -dir migrations -seq create_users_table

# Result:
# migrations/001_create_users_table.up.sql
# migrations/001_create_users_table.down.sql
\`\`\`

### 4.2 Migration Best Practices

✅ **DO:**
- Test migrations locally first
- Write reversible \`.down.sql\` files
- Use transactions (\`BEGIN;\` / \`COMMIT;\`)
- Add indexes concurrently in production
- Backup before major migrations

❌ **DON'T:**
- Drop columns in same migration as adding new ones
- Lock tables for extended periods
- Run migrations without testing on staging

    err := h.db.PingContext(r.Context())
    if err != nil {
        api.JSON(w, http.StatusServiceUnavailable, map[string]string{

## 7. Backup & Disaster Recovery

### 7.1 Database Backups

**Railway Automated Backups:**
- Daily snapshots (7-day retention)
- Point-in-time recovery
- One-click restore

**Manual Backup:**

\`\`\`bash
# Export database
pg_dump $DATABASE_URL > backup_$(date +%Y%m%d).sql

# Import database
psql $DATABASE_URL < backup_20260527.sql
\`\`\`

### 7.2 Disaster Recovery Plan

**Scenario: Database corruption**

1. **Stop writes:** Scale backend to 0 instances
2. **Restore:** Railway dashboard → Database → Restore
3. **Verify:** Run health checks
4. **Resume:** Scale backend back up

**RTO (Recovery Time):** < 30 minutes
**RPO (Recovery Point):** < 24 hours

✅ **Environment Variables:**

        html = html.replace(/^---$/gm, '<hr>');

        // Tables
        html = html.replace(/((?:^\|.+\|$\n?)+)/gm, (match) => {
            const rows = match.trim().split('\n').filter(r => !r.match(/^\|[\s-:|]+\|$/));
            if (rows.length === 0) return match;

            let table = '<table>';
            rows.forEach((row, i) => {
                const cells = row.split('|').filter(c => c.trim() !== '');
                const tag = i === 0 ? 'th' : 'td';
                table += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
            });
            table += '</table>';
            return table;
        });

        // Lists
        html = html.replace(/((?:^- .+\n?)+)/gm, (match) => {
            const items = match.trim().split('\n').map(l => `<li>${l.replace(/^- /, '')}</li>`).join('');
            return `<ul>${items}</ul>`;
        });

        html = html.replace(/((?:^\d+\. .+\n?)+)/gm, (match) => {
            const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
            return `<ol>${items}</ol>`;
        });

        // Checkboxes
        html = html.replace(/\[ \]/g, '☐');
        html = html.replace(/\[x\]/g, '☑');

        // Paragraphs (lines that aren't already wrapped)
        html = html.split('\n\n').map(block => {
            if (block.trim() === '') return '';
            if (block.match(/^<(h[1-6]|ul|ol|pre|table|hr|div)/)) return block;
            if (!block.includes('<')) return `<p>${block.replace(/\n/g, '<br>')}</p>`;
            return block;
        }).join('\n');

        return html;
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    document.getElementById('content').innerHTML = parseMarkdown(specContent);

    function downloadSpec() {
        const blob = new Blob([specContent], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'TEREN_Hotels_Deployment_Strategy_v1.0.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // Visual feedback
        const btn = document.querySelector('.btn-download');
        const originalText = btn.innerHTML;
        btn.innerHTML = '✓ Downloaded';
        btn.style.backgroundColor = '#16A34A';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.backgroundColor = '';
        }, 2000);
    }
</script>

services:
  postgres:
    image: postgres:16-alpine
    container_name: teren-hotels-db
    environment:
      POSTGRES_USER: teren
      POSTGRES_PASSWORD: teren123
      POSTGRES_DB: teren_hotels
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teren -d teren_hotels"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: teren_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgres://teren_dev:teren_dev_password@postgres:5432/teren_hotels?sslmode=disable
      - JWT_SECRET=dev_secret_min_32_chars_change_in_prod
      - JWT_EXPIRY=24h
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - SERVER_PORT=8080
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: teren_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://localhost:8080/api/v1
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  pgdata:
  go_modules:

services:
  postgres:
    image: postgres:16-alpine
    container_name: teren-hotels-db
    environment:
      POSTGRES_USER: teren
      POSTGRES_PASSWORD: teren123
      POSTGRES_DB: teren_hotels
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teren -d teren_hotels"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

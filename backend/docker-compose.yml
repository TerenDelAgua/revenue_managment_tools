version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: teren-hotels-db
    environment:
      POSTGRES_USER: teren
      POSTGRES_PASSWORD: teren123
      POSTGRES_DB: teren_hotels
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teren -d teren_hotels"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
